<!--
CleverTap Custom HTML in-app — SR-1 · PAGE 2 (आज के कार्य) · CASE: NONE ASSIGNED — ELEVATED DESIGN v2
Self-contained (inline CSS + inline SVG illustration), CleverTap-ready (Liquid Event tokens + JS bridge + preview fallback).
Event props: total_count, today_install, lead_areas
"Include JavaScript" required. CTA opens wiom://tickets/assign (confirm route).
NOTE: Different CTA from SOME case — here NO ticket is assigned yet, so the owner must assign ALL tickets ("सभी टिकट assign करें").
-->
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SR-1 · आज के कार्य</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Nirmala UI','Segoe UI',sans-serif;color:#16121F;-webkit-font-smoothing:antialiased;overflow:hidden;
       background:linear-gradient(180deg,#FBEFF6 0%,#F4F2F8 36%,#F4F2F8 100%)}
  .screen{position:relative;height:100%;display:flex;flex-direction:column;padding:20px 22px 24px}

  .title{text-align:center;font-size:16px;font-weight:700;letter-spacing:.2px;color:#897F98}

  .hero{flex:none;display:flex;justify-content:center;margin:16px 0 18px}
  .badge{width:90px;height:90px;filter:drop-shadow(0 10px 20px rgba(217,45,32,.22))}

  .mini{font-size:12px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:#9A8FAE;margin:0 0 8px 4px}

  .card{width:100%;background:#FFFFFF;border:1px solid #F0EEF5;border-radius:18px;padding:4px 18px;
        box-shadow:0 10px 30px rgba(50,30,70,.07)}
  .row{display:flex;align-items:center;gap:12px;padding:15px 0;font-size:15px;color:#352E45;line-height:1.35}
  .row+.row{border-top:1px solid #F3F0F8}
  .row .ic{width:24px;height:24px;flex:none}
  .row .t{flex:1;min-width:0}
  .row .t b{font-weight:800;color:#16121F}
  .ic-pink{color:#D9008D}
  .ic-gray{color:#6C5F86}

  .alert{display:flex;align-items:flex-start;gap:11px;background:#FEECEB;border:1px solid #F6C9C4;border-radius:14px;
         padding:14px 15px;margin-top:2px;font-size:14px;font-weight:600;color:#B42318;line-height:1.4;
         box-shadow:0 8px 20px rgba(217,45,32,.08)}
  .alert .ic{width:22px;height:22px;flex:none;color:#D92D20}
  .alert .t{flex:1;min-width:0}
  .alert b{font-weight:800}

  .spacer{flex:1;min-height:16px}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;text-decoration:none;font-family:inherit;
       font-size:16.5px;font-weight:800;padding:18px 16px;border-radius:15px;cursor:pointer;flex:none;color:#fff;
       background:linear-gradient(180deg,#E11C97 0%,#C70680 100%);box-shadow:0 10px 22px rgba(199,6,128,.30)}
  .cta:active{transform:translateY(1px)}
  .cta svg{flex:none}
</style>
</head>
<body>
<div class="screen">

  <div class="title">आज के कार्य</div>

  <div class="hero">
    <svg class="badge" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="ga" x1="30" y1="20" x2="92" y2="100" gradientUnits="userSpaceOnUse"><stop stop-color="#F2604E"/><stop offset="1" stop-color="#D92D20"/></linearGradient></defs><circle cx="60" cy="60" r="54" fill="#FEECEB"/><circle cx="60" cy="58" r="40" fill="url(#ga)"/><path d="M60 40v23" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/><circle cx="60" cy="75" r="4.6" fill="#fff"/><g fill="#F2604E"><circle cx="101" cy="33" r="3.2"/><circle cx="20" cy="45" r="2.4"/></g></svg>
  </div>

  <div class="alert">
    <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
    <span class="t"><b>{{ Event.total_count | default: "6" }}</b> टिकट पर अभी कोई टेक्निशियन नहीं — सभी को assign करें</span>
  </div>

  <div class="mini">आज के install</div>
  <div class="card">
    <div class="row">
      <svg class="ic ic-gray" viewBox="0 0 24 24" fill="currentColor"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
      <span class="t"><b>{{ Event.today_install | default: "2" }} install</b> पेंडिंग — {{ Event.lead_areas | default: "संगम विहार, बुराड़ी" }}</span>
    </div>
  </div>

  <div class="spacer"></div>
  <a class="cta" href="javascript:void(0)" onclick="ctOpen()">सभी टिकट assign करें
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

</div>

<script>
(function(){
  function iosBridge(){ return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap; }
  function fire(a,c,i){try{ if(window.CleverTap&&typeof window.CleverTap.triggerInAppAction==="function"){window.CleverTap.triggerInAppAction(JSON.stringify(a),c,i);} else if(iosBridge()){window.webkit.messageHandlers.clevertap.postMessage({action:"triggerInAppAction",actionJson:a,callToAction:c,buttonId:i});} }catch(e){}}
  window.ctOpen=function(){ var u="wiom://tickets/assign"; fire({type:"url",android:u,ios:u,url:u},"Assign tickets","sr1_today_cta"); };
})();
</script>
<script>
(function(){try{ if(!document.body||document.body.innerHTML.indexOf("{{")===-1)return;
  var rx=/\{\{\s*(?:Event|Profile)\.[^}|]*\|\s*default:\s*["']([^"']*)["']\s*\}\}/g;
  var w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){var p=n.parentNode;if(p&&(p.nodeName==="SCRIPT"||p.nodeName==="STYLE"))return NodeFilter.FILTER_REJECT;return (n.nodeValue.indexOf("{{")>-1)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP;}});
  var a=[],n;while(n=w.nextNode())a.push(n);a.forEach(function(t){t.nodeValue=t.nodeValue.replace(rx,"$1");});
}catch(e){}})();
</script>
</body>
</html>
